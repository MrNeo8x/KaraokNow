name: karaokenow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: karaokenow
      POSTGRES_USER: karaokenow
      POSTGRES_PASSWORD: karaokenow_local_only
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaokenow -d karaokenow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - karaokenow-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://karaokenow:karaokenow_local_only@postgres:5432/karaokenow
      JWT_SECRET: local-uat-docker-secret-change-before-production
      PORT: 3000
      OTEL_SERVICE_NAME: karaokenow-backend-uat
      # FE-012: the local stack is plain HTTP (http://localhost:3100); Safari drops Secure cookies there.
      AUTH_COOKIE_SECURE: "false"
    volumes:
      # PD-037 local storage: keep uploaded files across rebuilds (be/.storage is git-ignored; may contain demo/customer files).
      - ./.storage:/app/.storage
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  # OPS-005 operations containers (image target `tools`). Opt-in via profiles:
  #   docker compose --profile tools run --rm migrate      # apply migrations from inside Docker
  #   docker compose --profile workers up -d               # hold-expiry and outbox workers
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    environment:
      DATABASE_URL: postgresql://karaokenow:karaokenow_local_only@postgres:5432/karaokenow
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  hold-expiry-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npm", "run", "holds:expire"]
    environment: &worker-env
      DATABASE_URL: postgresql://karaokenow:karaokenow_local_only@postgres:5432/karaokenow
      JWT_SECRET: local-uat-docker-secret-change-before-production
      OTEL_SERVICE_NAME: karaokenow-worker-uat
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  outbox-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npm", "run", "outbox:work"]
    environment: *worker-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../fe
      dockerfile: Dockerfile
      args:
        BACKEND_API_ORIGIN: http://backend:3000
    environment:
      BACKEND_API_ORIGIN: http://backend:3000
    ports:
      - "3100:3100"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  karaokenow-postgres:

